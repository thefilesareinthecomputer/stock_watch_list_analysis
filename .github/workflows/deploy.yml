name: Validate & Deploy Stock Analytics Bundle

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        # Exact tag: setup-uv publishes floating major tags only through v7.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Run unit tests
        run: uv run pytest tests/ -v

  validate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: databricks/setup-cli@main
      - name: Validate bundle
        run: databricks bundle validate
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - uses: databricks/setup-cli@main
      - name: Materialize private watchlist from secret
        env:
          WATCHLIST: ${{ secrets.WATCHLIST }}
        run: |
          if [ -n "$WATCHLIST" ]; then
            echo "$WATCHLIST" | tr ',' '\n' | tr -d ' \r' | sed '/^$/d' > src/common/tickers.txt
            echo "Wrote $(wc -l < src/common/tickers.txt) tickers to tickers.txt"
          else
            echo "WATCHLIST secret empty; deploy falls back to tickers.example.txt"
          fi
      - name: Deploy bundle
        run: databricks bundle deploy
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          BUNDLE_VAR_fred_api_key: ${{ secrets.FRED_API_KEY }}
          BUNDLE_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
