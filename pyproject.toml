[project]
name = "stock-watch-list-analysis"
version = "0.1.0"
description = "Databricks medallion lakehouse for equity analytics"
# Databricks serverless environment_version "3" runs Python 3.12.3. Capped at
# <3.13 so resolution cannot drift onto an interpreter the job will never use.
requires-python = ">=3.12,<3.13"
dependencies = [
    "yfinance==1.3.0",
    # Matches the numpy in Databricks serverless environment_version "3", whose
    # pyarrow 15.0.2 requires numpy<2. Tests run what the job runs.
    "numpy==1.26.4",
    "pandas==3.0.2",
    "python-dotenv>=1.0",
    "exchange-calendars==4.13.2",
    "fredapi==0.5.2",
    "requests==2.32.2",
]

# pyspark and pytest run the tests locally and in CI. On Databricks, Spark is
# provided by the serverless runtime and pipeline deps come from databricks.yml,
# so neither this file nor uv.lock is used there.
[dependency-groups]
dev = [
    "duckdb>=1.5.5",
    "pyspark==4.1.1",
    "pytest==9.0.3",
]

# src/ is executed by path (Databricks spark_python_task), not installed as a
# package, so uv manages only the dependency environment.
[tool.uv]
package = false
